<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="100%" style="stop-color:#1B3A5C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg3)" rx="8"/>

  <!-- Estrellas -->
  <circle cx="20"  cy="15"  r="1.5" fill="white" opacity="0.8"/>
  <circle cx="60"  cy="30"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="100" cy="10"  r="1.5" fill="white" opacity="0.9"/>
  <circle cx="150" cy="25"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="200" cy="8"   r="2"   fill="white" opacity="0.7"/>
  <circle cx="250" cy="20"  r="1"   fill="white" opacity="0.6"/>
  <circle cx="300" cy="12"  r="1.5" fill="white" opacity="0.8"/>
  <circle cx="350" cy="28"  r="1"   fill="white" opacity="0.5"/>
  <circle cx="380" cy="10"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="40"  cy="170" r="1"   fill="white" opacity="0.5"/>
  <circle cx="370" cy="160" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="390" cy="180" r="1"   fill="white" opacity="0.4"/>

  <!-- Planeta -->
  <circle cx="345" cy="110" r="45" fill="#1565C0" opacity="0.7"/>
  <ellipse cx="345" cy="110" rx="65" ry="12" fill="none" stroke="#42A5F5" stroke-width="3" opacity="0.6"/>
  <circle cx="345" cy="110" r="45" fill="none" stroke="#1976D2" stroke-width="1" opacity="0.3"/>

  <!-- Cohete pequeño -->
  <path d="M50,160 L55,130 L60,160 Z" fill="#90CAF9" opacity="0.6"/>
  <rect x="52" y="155" width="6" height="10" rx="1" fill="#42A5F5" opacity="0.5"/>
  <path d="M52,160 L46,168 L52,165 Z" fill="#FF7043" opacity="0.7"/>
  <path d="M58,160 L64,168 L58,165 Z" fill="#FF7043" opacity="0.7"/>

  <!-- Badge 2x1 -->
  <circle cx="85" cy="95" r="42" fill="#00E5FF" opacity="0.15"/>
  <circle cx="85" cy="95" r="38" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.5" stroke-dasharray="6,3"/>
  <text x="85" y="85" font-family="Arial, sans-serif" font-size="34" font-weight="900"
        text-anchor="middle" fill="#00E5FF">2x1</text>
  <text x="85" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="700"
        text-anchor="middle" fill="#80DEEA" letter-spacing="1">OFERTA</text>

  <!-- Texto principal -->
  <text x="218" y="78" font-family="Arial, sans-serif" font-size="11" font-weight="700"
        text-anchor="middle" fill="#80DEEA" letter-spacing="3">COLECCIÓN</text>
  <text x="218" y="112" font-family="Arial, sans-serif" font-size="26" font-weight="900"
        text-anchor="middle" fill="white">Ciencia Ficción</text>

  <rect x="100" y="120" width="236" height="1.5" fill="#00E5FF" opacity="0.4" rx="1"/>

  <text x="218" y="145" font-family="Arial, sans-serif" font-size="13"
        text-anchor="middle" fill="#B3E5FC" opacity="0.9">Llevá dos, pagá uno</text>
  <text x="218" y="168" font-family="Arial, sans-serif" font-size="11"
        text-anchor="middle" fill="#80DEEA" opacity="0.7">Explorá el universo sin límites</text>
</svg>
