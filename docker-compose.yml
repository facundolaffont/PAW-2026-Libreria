services:
  php:
    build: .
    volumes:
      - ./src:/app
    working_dir: /app
    command: >
      sh -c "\
        until nc -z mysql 3306; do
          echo 'Esperando a MySQL...';
          sleep 2;
        done &&
        composer install &&
        vendor/bin/phinx migrate -c phinx.php &&
        vendor/bin/phinx seed:run -c phinx.php -s BooksSeeder &&
        vendor/bin/phinx seed:run -c phinx.php -s PromotionsSeeder &&
        php -S 0.0.0.0:8000 -t public\
      "
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_TO: ${MAIL_TO}

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    environment:
      ADMINER_DEFAULT_SERVER: ${DB_HOST}
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data: